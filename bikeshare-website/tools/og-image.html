<!doctype html>
<!-- Template for site/img/og-image.png (1200x630, WhatsApp/Telegram/iMessage preview).
     Edit the text, then run: node tools/render-images.mjs -->
<html><head><meta charset="utf-8">
<style>
  @font-face { font-family: Inter; src: url("../site/fonts/inter-latin-wght.woff2") format("woff2"); font-weight: 100 900; }
  * { margin: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; font-family: Inter, sans-serif; background: #FBFBFA; color: #0B0B0C; overflow: hidden; position: relative;
    background-image: linear-gradient(#E9E9E5 1px, transparent 1px), linear-gradient(90deg, #E9E9E5 1px, transparent 1px); background-size: 48px 48px; }
  .wrap { position: absolute; left: 80px; top: 64px; width: 680px; }
  .logo { display: flex; align-items: center; gap: 14px; font-size: 30px; font-weight: 700; letter-spacing: -.03em; }
  .logo svg { width: 46px; height: 46px; }
  h1 { margin-top: 48px; font-size: 92px; white-space: nowrap; font-weight: 750; letter-spacing: -.058em; line-height: .9; }
  p { margin-top: 24px; font-size: 28px; color: #5F5F64; letter-spacing: -.01em; }
  .badge { position: absolute; left: 80px; bottom: 64px; display: inline-flex; align-items: center; gap: 14px; padding: 14px 24px 14px 18px; border-radius: 999px; background: #fff; box-shadow: inset 0 0 0 1.5px #E6E6E2; font-size: 24px; font-weight: 600; }
  .badge i { width: 14px; height: 14px; border-radius: 50%; background: #FF5A1F; box-shadow: 0 0 0 6px #FFE6DC; }
  .card { position: absolute; right: 64px; top: 64px; width: 360px; height: 502px; border-radius: 36px; background: #DCEAFF; overflow: hidden; }
  .phone { position: absolute; left: 50%; top: 56px; transform: translateX(-50%); width: 250px; height: 520px; border-radius: 40px; background: #111113; padding: 8px; box-shadow: 0 30px 60px -20px rgba(10,20,40,.45); }
  .screen { height: 100%; border-radius: 33px; background: #fff; padding: 52px 18px 0; }
  .eb { font-size: 12px; font-weight: 600; color: #8E8E93; } .t { font-size: 24px; font-weight: 750; letter-spacing: -.035em; margin-top: 2px; }
  .item { display: flex; align-items: center; gap: 10px; padding: 10px; margin-top: 10px; border-radius: 16px; background: #F6F6F4; font-size: 13px; font-weight: 650; }
  .item.on { background: #fff; box-shadow: 0 0 0 2px #0B0B0C; }
  .ic { width: 38px; height: 38px; border-radius: 12px; background: #fff; box-shadow: inset 0 0 0 1px #E6E6E2; display: grid; place-items: center; }
  .tag { margin-left: auto; padding: 4px 9px; border-radius: 99px; background: #DFF5E8; color: #13804A; font-size: 11px; }
  .cta { margin-top: 16px; height: 44px; border-radius: 22px; background: #0B0B0C; color: #fff; display: grid; place-items: center; font-size: 14px; font-weight: 650; }
  .canopy { position: absolute; left: 0; right: 0; bottom: 120px; height: 20px; background: #FF5A1F; }
  .grass { position: absolute; left: 0; right: 0; bottom: 0; height: 130px; background: #8ED29E; }
  .sun { position: absolute; right: -30px; top: -30px; width: 140px; height: 140px; border-radius: 50%; background: #FFD36B; }
</style></head>
<body>
  <div class="wrap">
    <div class="logo"><svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="16" fill="#0B0B0C"/><g fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><circle cx="10.5" cy="19" r="4"/><circle cx="21.5" cy="19" r="4"/><path d="M10.5 19l4-6.5h5l2 6.5M14.5 12.5L16 19"/></g></svg>[NAME]</div>
    <h1>Campus bikes,<br>shared.</h1>
    <p>Bike sharing at Schule Louisenlund.<br>Pilot launch January 2027.</p>
  </div>
  <div class="badge"><i></i>Join the waitlist · 2 free reservations</div>
  <div class="card">
    <div class="sun"></div><div class="grass"></div><div class="canopy"></div>
    <div class="phone"><div class="screen">
      <div class="eb">School Station</div><div class="t">Book a bike</div>
      <div class="item on"><span class="ic"><svg width="26" height="17" viewBox="0 0 120 76"><g fill="none" stroke="#4F7CFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><circle cx="25" cy="50" r="21"/><circle cx="95" cy="50" r="21"/><path d="M25 50 L46 22 H80 L95 50 M46 22 L60 50 L80 22 M25 50 H60"/></g></svg></span>City bike #07<span class="tag">Free</span></div>
      <div class="item"><span class="ic"><svg width="26" height="17" viewBox="0 0 120 76"><g fill="none" stroke="#2BB673" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><circle cx="25" cy="50" r="21"/><circle cx="95" cy="50" r="21"/><path d="M25 50 L46 22 H80 L95 50 M46 22 L60 50 L80 22 M25 50 H60"/></g></svg></span>Trekking #03<span class="tag">Free</span></div>
      <div class="cta">Book for 30 min</div>
    </div></div>
  </div>
</body></html>
